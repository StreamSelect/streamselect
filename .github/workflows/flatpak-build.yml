name: Flatpak build (reusable)

# The ONE definition of how StreamSelect.flatpak is built and smoke-tested. Called by
# flatpak.yml (pull requests: build only) and flatpak-rolling.yml (main: build,
# then attach to the rolling release). Split so a PR never shows a publish job
# that is always SKIPPED there — merges happen only when every
# check is SUCCESS, and a by-design skip would block it forever.
on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      # The host's preinstalled toolchains are mounted so they can be cleared:
      # building mpv and ffmpeg with no cache fills the runner's disk otherwise.
      options: >-
        --privileged
        -v /usr/local/lib/android:/host/android
        -v /usr/share/dotnet:/host/dotnet
        -v /opt/hostedtoolcache:/host/toolcache
    steps:
      - name: Free disk space
        run: |
          rm -rf /host/android/* /host/dotnet/* /host/toolcache/*
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp the build id
        # One builder for every workflow (scripts/build_id.sh), so a Flatpak
        # and a .dmg built from one commit name it identically.
        run: scripts/build_id.sh --stamp

      - name: Build the bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: StreamSelect.flatpak
          manifest-path: packaging/flatpak/io.github.streamselect.StreamSelect.yml
          # mpv + ffmpeg dominate the build; key the cache on the manifest so
          # an app-only change reuses them.
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/io.github.streamselect.StreamSelect.yml') }}
          upload-artifact: false

      - name: Smoke test — the bundle must install, launch and play-ready
        # The macOS job learned this the hard way: every packaging bug so far
        # was a MISSING FILE the test suite cannot see, because tests run from
        # a checkout where every file exists. So install the real bundle and
        # start it.
        run: |
          set -u
          flatpak install -y --noninteractive ./StreamSelect.flatpak

          # 1. The bundled mpv runs — playback depends on nothing else.
          flatpak run --command=mpv io.github.streamselect.StreamSelect --version \
            || { echo "::error::bundled mpv failed to run"; exit 1; }

          # 2. The app boots headless with a fresh HOME and stays up.
          export HOME="$RUNNER_TEMP/smoke-home"; mkdir -p "$HOME"
          LOG="$RUNNER_TEMP/streamselect-smoke.log"
          QT_QPA_PLATFORM=offscreen flatpak run --env=QT_QPA_PLATFORM=offscreen \
            io.github.streamselect.StreamSelect >"$LOG" 2>&1 &
          APP_PID=$!
          for _ in $(seq 1 25); do
            sleep 1
            kill -0 "$APP_PID" 2>/dev/null || break
          done
          if kill -0 "$APP_PID" 2>/dev/null; then
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
            echo "App stayed up — launch OK."
          else
            echo "::error::StreamSelect exited during launch inside the Flatpak."
            cat "$LOG"; exit 1
          fi
          if grep -qE "Traceback \(most recent call last\)|ModuleNotFoundError|FileNotFoundError" "$LOG"; then
            echo "::error::Exception during launch — see the log below."
            cat "$LOG"; exit 1
          fi
          tail -30 "$LOG" || true

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          # One day: the file is also published to a release (or only handed to
          # the next job). Kept 90 days, every push's copies filled the 0.5 GB
          # Actions storage (2026-11-13).
          retention-days: 1
          name: StreamSelect-flatpak
          path: StreamSelect.flatpak
          if-no-files-found: error

