# StreamSelect Sports Definitions — the one list
# ─────────────────────────────────────────────────────────────────────────────
# Every part of the app that asks "what sport is this?" reads this file through
# streamselect/core/sports_catalog.py: whether a live channel is in Sports at all,
# the sport and league stored on each channel (ingestion), PPV and live-event
# rows, the guide's "Sports" type, and the game finder's leagues. Design: "One
# Sports List" (2026-11-27). There is no other copy, in code or in the user's
# config folder.
#
# sports:
#   <key>:                 stored in channels.sport_type and in preferences: never rename
#     name:                what the app shows
#     words:               words that say this sport on their own. They put a live
#                          channel in Sports and tag it. "word*" matches at the start
#                          of a word (SPORTSNET); every other word matches whole
#                          ("nba" never inside GREENBAY).
#     leagues:
#       <League>:          stored in channels.league_name and games.league
#         words:           the league's names. They tag a channel already in Sports
#                          and name the league's sport; they put a channel in Sports
#                          only with  gates: true.
#         capitals: true   an all-capitals word ("AHL") counts only where a listing
#                          writes it in capitals: "Ahl" is a word in Arabic titles.
#         shared: true     the name is used by more than one sport or country
#                          ("Premier League"): it names the sport only when nothing
#                          else on the listing does, as a guess.
#         finder:          listed | trial | off (default off). Only listed and trial
#                          leagues have games found (core/games/). A league is
#                          listed only after the method's test: zero false Level 1
#                          games over 4+ snapshots, checked against an official
#                          schedule. Only league words here: never a source,
#                          collection or channel name.
#
# The longest matching word decides; ties go to the sport listed first.
#
# networks:  words naming a sports channel that carries many sports (Sky Sports,
#            beIN). They put a channel in Sports; it is stored as "network" when
#            nothing names one sport.
# slots:     a slot is a numbered feed the source fills with a different event
#            each day. labels: patterns for the slot's own name ("US: SOCCER PPV
#            80"), never read as its content; numbered: a whole name that is only
#            a slot number; empty: words saying the slot has nothing on.
#
# After changes, stored rows re-derive once when core/migrations/sports_reclassify
# CURRENT_VERSION goes up.
# ─────────────────────────────────────────────────────────────────────────────

sports:
  hockey:
    name: Hockey
    words: [hockey, ice hockey, flohockey]
    leagues:
      NHL:
        words: [NHL, Stanley Cup]
        gates: true
        finder: listed
        # A team's former name -> its name now. Listings keep an old name for a
        # while (a 24/7 team channel still says UTAH HOCKEY CLUB); the team book
        # reads it as the current team (owner, 2026-11-27).
        renamed: {Utah Hockey Club: Utah Mammoth}
      # TRIAL (owner, 2026-11-17): not yet through the test above. One source
      # lists AHL games with clock times and no zone; their collections borrow a
      # clock their sibling collections learned from NHL games (finder
      # _with_borrowed), never a typed one, and a game whose borrowed times
      # disagree stays less certain.
      AHL:
        words: [AHL, American Hockey League]
        capitals: true
        finder: trial
      # TRIAL (owner, 2026-11-17): listings state date and zone; each game is in
      # one collection, so its games are less certain until a second lists them.
      Hockeyallsvenskan:
        words: [Hockeyallsvenskan]
        finder: trial
      # TRIAL (owner, 2026-11-18): one snapshot, each game in 4-5 collections with
      # learned clocks. Not yet through the test above.
      Liiga:
        words: [Liiga, SM-liiga]
        finder: trial
      # TRIAL (owner, 2026-11-18): one snapshot, 3 games in 3-5 collections. Not the
      # bare "CHL": that is also Chile's country code (and the Canadian junior league).
      Champions Hockey League:
        words: [Champions Hockey League]
        finder: trial
      # TRIAL (owner, 2026-11-18): one snapshot, 3 confirmed games; listings state
      # date and zone.
      Hockey Ettan:
        words: [Hockey Ettan, Hockeyettan]
        finder: trial
      # TRIAL (owner, 2026-11-18): one snapshot, one game in one collection.
      Metal Ligaen:
        words: [Metal Ligaen]
        finder: trial
      # Tagging only. No listing named these on 2026-11-18, so there was nothing to
      # check the finder against; each league run reads every listing, so an empty
      # league still costs seconds per refresh.
      OHL:
        words: [OHL, Ontario Hockey League]
      QMJHL:
        words: [QMJHL, Quebec Hockey League, Quebec Junior Hockey League, Quebec Major Junior]
      WHL:
        words: [WHL, Western Hockey League]
      SHL:
        words: [SHL, Svensk Hockey]
      ECHL:
        words: [ECHL]
      KHL:
        words: [KHL]
      # NOT the bare "DEL" (2026-11-18): it took in Spanish/Italian "del" (alpine
      # skiing, boxing, handball). "Deutsche Eishockey Liga" / "PENNY DEL" found
      # nothing for the finder that day.
      DEL:
        words: [Deutsche Eishockey Liga, PENNY DEL]
  field_hockey:
    name: Field hockey
    words: [field hockey]
  basketball:
    name: Basketball
    words: [basketball, flohoops]
    leagues:
      # TRIAL (owner, 2026-11-18): the second sport, to build the Sports view for more
      # than one. One snapshot: 13 confirmed, 13 less certain, clean team names. Not
      # yet through the test above.
      NBA:
        words: [NBA]
        gates: true
        finder: trial
      # TRIAL (owner, 2026-11-23: "add all known basketball leagues"). The key is the
      # league's short name, as the Sports view shows it and preferences are kept
      # under; the words are its other names. Measured on one snapshot (Monday
      # 2026-11-23, real finder, read-only): NCAAB 17 confirmed / 1 less certain;
      # EuroLeague 0/7; EuroCup, ACB, LNB a game or two; the rest named by no listing
      # that day (off season, or no source carries them). None is through the test above.
      # No bare word that names another sport: not "BBL" (cricket's Big Bash),
      # "PBA" (bowling), "Betclic" (Portugal's football league), "BSL", or "NCAA
      # Women" / "College Basketball" ("NCAA Women's Volleyball", "Women's College
      # Basketball" is the women's league).
      NCAAB:
        words: [NCAAB, NCAAM, NCAA Basketball, NCAA Men's Basketball, NCAA Men`s Basketball, Men's College Basketball]
        finder: trial
      NCAAW:
        words: [NCAAW, NCAA Women's Basketball, NCAA Women`s Basketball, Women's College Basketball, Women`s College Basketball]
        finder: trial
      WNBA:
        words: [WNBA]
        finder: trial
      G League:
        words: [G League, G-League]
        finder: trial
      EuroLeague:
        words: [EuroLeague]
        finder: trial
      EuroCup:
        words: [EuroCup]
        finder: trial
      BCL:
        words: [Basketball Champions League]
        finder: trial
      FIBA:
        words: [FIBA, EuroBasket, AmeriCup, AfroBasket]
        finder: trial
      ACB:
        words: [ACB, Liga ACB, Liga Endesa]
        finder: trial
      LBA:
        words: [LBA, Lega Basket]
        finder: trial
      BBL:
        words: [Basketball Bundesliga, easyCredit BBL]
        finder: trial
      LNB:
        words: [Betclic Elite, LNB Pro A]
        finder: trial
      GBL:
        words: [Greek Basket League, Stoiximan Basket League]
        finder: trial
      BSL:
        words: [Basketbol Super Ligi, Turkish Basketball Super League]
        finder: trial
      VTB:
        words: [VTB United League, VTB League]
        finder: trial
      ABA:
        words: [ABA League, ABA Liga]
        finder: trial
      NBL:
        words: [NBL]
        finder: trial
      CBA:
        words: [CBA]
        finder: trial
      B.League:
        words: [B.League, B League]
        finder: trial
      KBL:
        words: [KBL]
        finder: trial
      PBA:
        words: [Philippine Basketball Association]
        finder: trial
      LNBP:
        words: [LNBP]
        finder: trial
      NBB:
        words: [NBB]
        finder: trial
      BAL:
        words: [Basketball Africa League]
        finder: trial
      BIG3:
        words: [BIG3]
        finder: trial
  soccer:
    name: Soccer
    words: [soccer, football, fifa, flosoccer, flofc, superliga]
    leagues:
      # Shared: Mauritania and Sierra Leone have Premier Leagues, and cricket's
      # Indian Premier League contains the words (measured 2026-11-18).
      Premier League:
        words: [Premier League, EPL]
        gates: true
        shared: true
      # Shared: handball has a Champions League too (measured 2026-11-18).
      Champions League:
        words: [Champions League, UCL]
        gates: true
        shared: true
      Europa League:
        words: [Europa League, UEL]
      La Liga:
        words: [La Liga]
        gates: true
      Bundesliga:
        words: [Bundesliga]
        gates: true
      Serie A:
        words: [Serie A]
      Ligue 1:
        words: [Ligue 1]
      MLS:
