  racing:
    name: Racing
    words: [f1*, formula*, floracing]
    leagues:
      # "Formel 1": Danish, German and Swedish listings (owner, 2026-11-27: the DK
      # PPV qualifying feeds were not Sports at all). Gates, so they are.
      Formula 1:
        words: [Formula 1, Formula One, Formule 1, Formel 1, F1]
        gates: true
      NASCAR:
        words: [NASCAR]
      # "Tissot Sprint": MotoGP's own name for its Saturday sprint race.
      MotoGP:
        words: [MotoGP, Tissot Sprint, Moto2, Moto3]
      IndyCar:
        words: [IndyCar]
      Rally:
        words: [Rally]
      # Shared and a guess: figure skating, darts, snooker and judo have Grand
      # Prix events too, so it names racing only when nothing else names a sport,
      # and never makes a channel Sports on its own (owner, 2026-11-27).
      Grand Prix:
        words: [Grand Prix]
        shared: true
  cricket:
    name: Cricket
    words: [cricket]
    leagues:
      IPL:
        words: [IPL]
      Test cricket:
        words: [Test Match]
      ODI:
        words: [ODI]
      T20:
        words: [T20]
  rugby:
    name: Rugby
    words: [rugby*, florugby]
    leagues:
      Six Nations:
        words: [Six Nations]
      Super Rugby:
        words: [Super Rugby]
  golf:
    name: Golf
    words: [golf]
    leagues:
      PGA:
        words: [PGA]
      # Shared: tennis and snooker have Masters events.
      The Masters:
        words: [Masters]
        shared: true
      The Open:
