      Ryder Cup:
        words: [Ryder Cup]
  cycling:
    name: Cycling
    # cyclocross: the UCI Cyclocross World Cup event rows (owner, 2026-11-27);
    # flobikes: FloSports' cycling feed, like flohoops.
    words: [cycling, cyclocross, cyclo-cross, flobikes]
    leagues:
      # Cycling's governing body: its World Cups (cyclocross, track, MTB) are all cycling.
      UCI:
        words: [UCI]
      Tour de France:
        words: [Tour de France]
      Vuelta:
        words: [Vuelta]
      # Shared: "giro" is an everyday Italian word (a tour, a round).
      Giro:
        words: [Giro]
        shared: true
  wrestling:
