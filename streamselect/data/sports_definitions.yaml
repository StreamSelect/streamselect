    words: [volleyball, flovolleyball]
  swimming:
    name: Swimming
    words: [swimming, floswimming]
  # "track" deliberately omits the bare word "track" (too many non-sport hits).
  track:
    name: Track and field
    words: [flotrack, track and field]
    leagues:
      # Not the bare "athletics": the Oakland Athletics play baseball.
      World Athletics:
        words: [World Athletics, Athletics Championships, Diamond League]
  # Library Breakdown BV-Q11 (2026-11-27): 7 event rows nothing identified, and 3
  # PPV "Short Program" rows that only a SOCCER PPV slot name had called soccer.
  figure_skating:
    name: Figure skating
    # German, Spanish and French too: 14 of the "Grand Prix" PPV rows were ISU
    # Grand Prix skating in those languages (owner, 2026-11-27).
    words: [figure skating, free skate, free dance, short program, ice dance, pairs skating,
            eiskunstlauf, kurzprogramm, patinaje artístico, patinaje artistico, programa corto,
            patinage artistique, programme court, danse sur glace]
    leagues:
      ISU Grand Prix:
        words: [ISU Grand Prix, NHK Trophy]
        gates: true
  # BV-Q11: 6 event rows. Not the bare "GS" ("Women's GS: Killington"): a sport word
  # also decides what counts as Sports, and two letters are too loose for that.
  skiing:
    name: Skiing
    words: [alpine skiing, slalom, downhill, super-g, super_g, ski jumping]

# Words naming a sports channel that carries many sports. Matched on the channel's
# NAME, after any slot label is removed. "moto*" catches MOTOR, MOTORVISION and
# MOTORSPORT and also MOTOWN (7 rows): the trade, stated. "racing" is here, not a
# word of Racing: "RACING TV" is horse racing.
networks:
  words: [sport*, moto*, espn*, tsn*, bein, sky sports, fox sports, nbc sports,
          kickboxing, racing, flosports, flo network]

slots:
  # A pipe-separated part of a name that is the slot's own name, not its event:
  # "… | US: SOCCER PPV 80" carried an NFL special and snooker on 2026-11-27.
  labels:
    - 'ppv\s*\d+\s*$'
    - '^\s*event\s*\d+\s*:?\s*$'
  # A whole name that is a slot number and nothing else: "FITE TV Event 09:", "ESPN+ 55 :".
  numbered:
    - '\bevent\s*\d+\s*:?\s*$'
    - '\d+\s*:\s*$'
  # Words saying the slot is empty right now.
  empty: [no event, no events]

# Reserved: Olympics, World Cup and the like (an event across or within sports, with
# its own dates and words; a game carries both its sport and its event). Not read yet.
events: {}

# sport_defaults:
#   Each sport's game timings (core/games/tuning.py; Settings ▸ Sports shows and
#   changes them — owner, 2026-11-18: "predefined but flexible"). ``default`` holds
#   every value; a sport's own block lists only what differs from it. Units are in
#   the setting (tuning.SPECS): game lengths in minutes, then min / h / days / s as
#   the page shows them. Changing a default here reaches every user who never set
#   that value; a user who did is asked once ("Some defaults were improved").
#   The defaults were measured on hockey listings (2026-11-08 to -18).
sport_defaults:
  default:
    usual_length: 165       # min (2 h 45)
    long_limit: 210         # min (3 h 30)
    still_on_adds: 30       # min
    still_on_window: 12     # h
    listed_back: 18         # h
    listed_ahead: 36        # h
    alert_keep: 12          # h after the start
    start_grace: 10         # min
    watched_after: 60       # s
    watch_early: 15         # min before the start
    most_watched_days: 30   # days
    report_days: 30         # days
    report_back: 5          # min of watching that takes one report back
    same_game: 90           # min
    replay_within: 72       # h
    stale_after: 48         # h
    guide_join: 15          # min
    clock_agree: 40         # min
    clock_keep: 14          # days
    usual_hours_off: 3      # h: a guide-only game this far from usual start times is a replay
    usual_hours_games: 5    # confirmed games before usual start times are used
    usual_hours_keep: 30    # days of confirmed start times kept
  hockey: {}
  # Basketball (NBA trial, 2026-11-18). Watched by the owner the first night: two
  # games listed at 8:00 PM had 90 s and 3 min left in the 4th at about 9:25 —
  # about 1 h 40 from the listed start to the end. (Ten guide slots said 2 h 26:
  # a guide slot is the broadcast's length, not the game's.) Re-measure as more
  # games are watched; overtime adds about 15 min a period.
  basketball:
    usual_length: 105       # min (1 h 45)
    long_limit: 135         # min (2 h 15: one overtime)

