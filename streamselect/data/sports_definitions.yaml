# sport_defaults:
#   Each sport's game timings (core/games/tuning.py; Settings ▸ Sports shows and
#   changes them — owner, 2026-11-18: "predefined but flexible"). ``default`` holds
#   every value; a sport's own block lists only what differs from it. Units are in
#   the setting (tuning.SPECS): game lengths in minutes, then min / h / days / s as
#   the page shows them. Changing a default here reaches every user who never set
#   that value; a user who did is asked once ("Some defaults were improved").
#   The defaults were measured on hockey listings (2026-11-08 to -18).
sport_defaults:
  default:
    usual_length: 165       # min (2 h 45)
    long_limit: 210         # min (3 h 30)
    still_on_adds: 30       # min
    still_on_window: 12     # h
    listed_back: 18         # h
    listed_ahead: 36        # h
    alert_keep: 12          # h after the start
    start_grace: 10         # min
    watched_after: 60       # s
    watch_early: 15         # min before the start
    most_watched_days: 30   # days
    report_days: 30         # days
    report_back: 5          # min of watching that takes one report back
    same_game: 90           # min
    replay_within: 72       # h
    stale_after: 48         # h
    guide_join: 15          # min
    clock_agree: 40         # min
    clock_keep: 14          # days
    usual_hours_off: 3      # h: a guide-only game this far from usual start times is a replay
    usual_hours_games: 5    # confirmed games before usual start times are used
    usual_hours_keep: 30    # days of confirmed start times kept
  hockey: {}
  # Basketball (NBA trial, 2026-11-18). Watched by the owner the first night: two
  # games listed at 8:00 PM had 90 s and 3 min left in the 4th at about 9:25 —
  # about 1 h 40 from the listed start to the end. (Ten guide slots said 2 h 26:
  # a guide slot is the broadcast's length, not the game's.) Re-measure as more
  # games are watched; overtime adds about 15 min a period.
  basketball:
    usual_length: 105       # min (1 h 45)
    long_limit: 135         # min (2 h 15: one overtime)

# game_finder_leagues:
#   Sport -> league -> the starting words for finding that league's GAMES (two sides
#   + a start), matched as whole words against channel names, collection names and
#   guide titles. Only league words: no source, collection or channel name ever goes
#   here. Each league is found ON ITS OWN: one pass over several leagues mixes their
#   team names (a college side read as a minor-league team) and a bare sport word
#   pulls in other sports ("HOCKEY" matched field hockey). A league is listed only
#   after it passes the method's test: zero false Level 1 games over 4+ snapshots,
#   checked against an official schedule.
game_finder_leagues:
  hockey:
    NHL:
      - NHL
    # TRIAL (owner, 2026-11-17): not yet through the test above. One source
    # lists AHL games with clock times and no zone; their collections borrow a
    # clock their sibling collections learned from NHL games (finder
    # _with_borrowed), never a typed one, and a game whose borrowed times
    # disagree stays less certain.
    AHL:
      - AHL
      - American Hockey League
    # TRIAL (owner, 2026-11-17): listings state date and zone; each game is in
    # one collection, so its games are less certain until a second lists them.
    Hockeyallsvenskan:
      - Hockeyallsvenskan
    # TRIAL (owner, 2026-11-18): one snapshot, each game in 4-5 collections with
    # learned clocks. Not yet through the test above.
    Liiga:
      - Liiga
      - SM-liiga
    # TRIAL (owner, 2026-11-18): one snapshot, 3 games in 3-5 collections. Not the
    # bare "CHL": that is also Chile's country code (and the Canadian junior league).
    Champions Hockey League:
      - Champions Hockey League
    # TRIAL (owner, 2026-11-18): one snapshot, 3 confirmed games; listings state
    # date and zone.
    Hockey Ettan:
      - Hockey Ettan
      - Hockeyettan
    # TRIAL (owner, 2026-11-18): one snapshot, one game in one collection.
    Metal Ligaen:
      - Metal Ligaen
    # NOT LISTED (2026-11-18): DEL — the word "DEL" took in Spanish/Italian "del"
    # (alpine skiing) and handball; "Deutsche Eishockey Liga" / "PENNY DEL" found
    # nothing. OHL, QMJHL, WHL, SHL, ECHL, KHL, NLA, DEL2, Extraliga: no listing
    # named them that day, so nothing to check; each league run reads every
    # listing, so an empty league still costs seconds per refresh.
  basketball:
    # TRIAL (owner, 2026-11-18): the second sport, to build the Sports view for more
    # than one. One snapshot: 13 confirmed, 13 less certain, clean team names. Not
    # yet through the test above.
    NBA:
      - NBA
    # TRIAL (owner, 2026-11-23: "add all known basketball leagues"). The key is the
    # league's short name, as the Sports view shows it and preferences are kept
    # under; the words are its other names. Measured on one snapshot (Monday
    # 2026-11-23, real finder, read-only): NCAAB 17 confirmed / 1 less certain;
    # EuroLeague 0/7; EuroCup, ACB, LNB a game or two; the rest named by no listing
    # that day (off season, or no source carries them). None is through the test above.
    # No bare word that names another sport: not "BBL" (cricket's Big Bash),
    # "PBA" (bowling), "Betclic" (Portugal's football league), "BSL", or "NCAA
